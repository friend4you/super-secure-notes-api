services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supersecurenotes
      POSTGRES_USER: ssn
      POSTGRES_PASSWORD: ssn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssn -d supersecurenotes"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ssn:ssn@db:5432/supersecurenotes
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
